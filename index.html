<!DOCTYPE html>
<!--
  Product architecture refactor: the app is now a router-driven shell.
  There's no static header or team-cards markup here anymore — every
  screen (Welcome, Home, Tracker, Settings) is rendered into #app by
  main.js based on the current route (see ui/router.js). See
  docs/problem-statement.md and README.md for the full picture.

  Sprint 4: Google Authentication (Firebase Auth) sits in front of all
  of that. #user-bar is a small persistent strip (avatar/name/Sign Out)
  shown above #app once a teacher is signed in — see
  services/authService.js and ui/components/UserBar.js. If no one is
  signed in, #app shows ui/views/LoginView.js instead of the router.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassMate</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/classmate-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <!--
      manifest.json and service-worker.js (see js/main.js's own
      registerServiceWorker()) already existed — added for FCM push
      infrastructure — but nothing here ever actually linked the
      manifest, which is what Chrome's own install-eligibility check
      requires to see it at all. theme-color mirrors manifest.json's
      own theme_color exactly, so the browser UI (address bar on the
      web, title bar once installed) and the installed app agree.
      apple-mobile-web-app-* covers iOS Safari's own separate "Add to
      Home Screen" affordance, which does not read manifest.json.
    -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ClassMate" />
    <!--
      Loaded non-render-blocking, deliberately: a plain
      <link rel="stylesheet"> to a third-party domain blocks the whole
      page's first render until that request resolves. If this
      specific request is slow, blocked, or unreachable on a given
      network (school/institutional WiFi filtering third-party font
      CDNs is common, and this is exactly the kind of failure that
      wouldn't show up in desktop testing on an unrestricted network),
      the page could sit blank indefinitely before any of the app's
      own CSS or JavaScript ever gets a chance to run — a different,
      earlier failure category than anything a JS error handler could
      catch, since nothing has executed yet. rel="preload" fetches it
      without blocking render; the small inline script swaps it to an
      active stylesheet once it's actually loaded. The <noscript>
      fallback covers the rare case of JavaScript being disabled.
    -->
    <!--
      Plus Jakarta Sans requested alongside Open Sans in this same
      one-URL Google Fonts request (rather than a second separate
      preload apparatus) — currently only used by
      css/styles.css's .notebook-tracker-view (see
      ui/views/NotebookTrackerView.js), per the newly-approved
      typeface direction in
      docs/ClassMate_Branding_Product_Foundation_v0.1.md. Every other
      screen still uses Open Sans (--font-body) until migrated.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="css/styles.css" />
    <!--
      Inline, not in css/styles.css: this must render even if that
      stylesheet itself is slow/blocked, since its whole job is to cover
      the gap before ANY of this app's own CSS/JS has necessarily taken
      effect yet (see js/main.js's own init()/onAuthStateChange() —
      nothing is painted into #app until the FIRST auth-state callback
      resolves, which on a cold mobile load over a flaky network can
      take several real seconds). Root cause of the 2026-10-08 "phone
      goes blank after scanning the TV QR code" report: this exact
      window previously showed nothing at all. #app-boot-loading is
      removed automatically the instant any real view renders, because
      every view's own render function starts with
      `container.innerHTML = ''` (see e.g. ui/views/LoginView.js) --
      nothing here needs to explicitly clear it.
    -->
    <style>
      #app-boot-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        min-height: 60vh;
        padding: 2rem 1.5rem;
        text-align: center;
        font-family: 'Open Sans', sans-serif;
        color: #475569;
      }
      #app-boot-loading__spinner {
        width: 2.25rem;
        height: 2.25rem;
        border: 3px solid #d7e2f1;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      #app-boot-loading__retry {
        display: none;
        margin-top: 0.5rem;
        font: inherit;
        font-weight: 700;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        border: none;
        background-color: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      #app-boot-loading[data-slow='true'] #app-boot-loading__retry {
        display: inline-block;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="user-bar"></div>
    <div class="app-shell">
      <div id="teacher-sidebar"></div>
      <div id="app">
        <div id="app-boot-loading">
          <div id="app-boot-loading__spinner" aria-hidden="true"></div>
          <p id="app-boot-loading__message">Loading ClassMate…</p>
          <button type="button" id="app-boot-loading__retry" onclick="window.location.reload()">Reload</button>
        </div>
      </div>
    </div>
    <div id="teacher-mobile-nav"></div>

    <!--
      Registered before the module script below, so it catches
      literally any startup failure — including one thrown during a
      module's own top-level evaluation, before main.js's own body
      ever runs. Renders a visible on-page message rather than only
      logging to the console, since most people testing this app on a
      phone have no easy way to open devtools there — a silent white
      screen with an error only visible in a desktop console is nearly
      undebuggable from the device actually showing the problem.
    -->
    <script>
      function showStartupError(message, detail) {
        var existing = document.getElementById('startup-error');
        if (existing) return; // don't stack multiple error banners
        var banner = document.createElement('div');
        banner.id = 'startup-error';
        banner.style.cssText =
          'position:fixed;inset:0;z-index:99999;background:#fff3f2;color:#7a1f1f;' +
          'font-family:sans-serif;padding:1.5rem;overflow:auto;box-sizing:border-box;';
        banner.innerHTML =
          '<h1 style="font-size:1.1rem;margin:0 0 0.75rem;">Something went wrong loading ClassMate</h1>' +
          '<p style="margin:0 0 0.75rem;">' + message + '</p>' +
          '<pre style="white-space:pre-wrap;font-size:0.8rem;background:#fff;border:1px solid #e3b3b0;' +
          'border-radius:6px;padding:0.75rem;">' + (detail || '') + '</pre>' +
          '<p style="margin:1rem 0 0.25rem;font-size:0.8rem;opacity:0.8;">User agent:</p>' +
          '<pre style="white-space:pre-wrap;font-size:0.75rem;background:#fff;border:1px solid #e3b3b0;' +
          'border-radius:6px;padding:0.75rem;">' + navigator.userAgent + '</pre>';
        document.body.appendChild(banner);
      }
      // `true` (capture phase) is load-bearing here, not decorative: a
      // resource that fails to load -- including a <script type="module">
      // itself, or any file it imports -- fires a non-bubbling 'error'
      // event that only reaches `window` in the CAPTURE phase, never the
      // default bubble phase a plain addEventListener('error', fn) call
      // listens on. Without capture:true, exactly this class of failure
      // (e.g. a network hiccup fetching js/main.js or one of its imports,
      // plausible right as a phone switches from the camera app to the
      // browser) left the page blank with NEITHER this banner NOR any
      // console output reachable on a phone -- the other confirmed
      // contributor to the 2026-10-08 blank-screen report, alongside the
      // missing #app-boot-loading state above.
      window.addEventListener(
        'error',
        function (event) {
          var isResourceLoadFailure = !event.error && !event.message && event.target && event.target !== window;
          if (isResourceLoadFailure) {
            // Scoped deliberately narrow: only a SCRIPT/stylesheet LINK
            // failing to load WHILE the app hasn't rendered its first
            // real view yet (the boot placeholder below is still the
            // only thing in #app) is treated as a startup failure worth
            // a full-page banner. Any other resource failure (a broken
            // student avatar <img>, a missing icon, anything AFTER the
            // app is already running) is common, benign, and unrelated
            // to startup -- showing this same full-page red banner for
            // those would itself be a regression, so those are only
            // logged, never surfaced this way.
            var bootEl = document.getElementById('app-boot-loading');
            var appEl = document.getElementById('app');
            var appStillBooting = !!(bootEl && appEl && appEl.contains(bootEl));
            var tag = event.target.tagName;
            var isCriticalTag = tag === 'SCRIPT' || (tag === 'LINK' && event.target.rel === 'stylesheet');
            if (!appStillBooting || !isCriticalTag) {
              console.error('[startup] non-critical resource failed to load:', event.target.src || event.target.href);
              return;
            }
            showStartupError(
              'A required file failed to load (check your connection and try again).',
              event.target.src || event.target.href || ''
            );
            return;
          }
          showStartupError(
            'A script error occurred before the app could load.',
            (event.error && event.error.stack) || event.message
          );
        },
        true
      );
      window.addEventListener('unhandledrejection', function (event) {
        showStartupError(
          'A background operation failed before the app could finish loading.',
          (event.reason && event.reason.stack) || String(event.reason)
        );
      });

      // Watchdog for the OTHER confirmed cause of a blank screen: nothing
      // failed, but the normal boot sequence (fetch every module cold,
      // then Firebase Auth's own session restore) is simply taking a long
      // time -- realistic on a flaky school WiFi/cellular connection on a
      // phone's first-ever visit. #app-boot-loading above already shows a
      // spinner immediately; if it is STILL the only thing in #app after
      // a generous timeout, reveal a manual Reload action rather than
      // leaving an unexplained spinner running forever.
      window.setTimeout(function () {
        var boot = document.getElementById('app-boot-loading');
        if (!boot || !document.getElementById('app').contains(boot)) return; // a real view already rendered -- nothing to do
        boot.setAttribute('data-slow', 'true');
        var message = document.getElementById('app-boot-loading__message');
        if (message) message.textContent = "This is taking longer than usual. Check your connection, or reload.";
      }, 10000);
    </script>

    <script type="module" src="js/main.js"></script>

    <!--
      Only executes in a browser that does NOT support ES modules at
      all (nomodule scripts are the inverse of type="module" ones,
      per the HTML spec) — such a browser wouldn't error on the
      script above, it would silently skip it entirely, with nothing
      for any error handler to ever catch. That produces exactly the
      reported symptom: a blank page with no error banner, because
      nothing ever tried to run. This is the one failure category the
      full import-graph audit above can't rule out from the code
      alone, since it's about whether the module script tag executes
      at all, not what's inside it.
    -->
    <script nomodule>
      document.body.innerHTML =
        '<div style="padding:1.5rem;font-family:sans-serif;">' +
        '<h1 style="font-size:1.1rem;">This browser can\u2019t run ClassMate</h1>' +
        '<p>Your browser doesn\u2019t support modern JavaScript modules, which this app requires. ' +
        'Please update Chrome, or try a different browser.</p></div>';
    </script>
  </body>
</html>
