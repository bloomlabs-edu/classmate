# Deploys a temporary preview of ClassMate for every pull request, so
# changes can be reviewed on a real, live URL before merging - the
# preview channel expires automatically after a few days and never
# touches the live site at classmate-302c2.web.app.

name: Deploy preview on PR
on: pull_request
jobs:
  deploy_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLASSMATE_302C2 }}'
          projectId: classmate-302c2
