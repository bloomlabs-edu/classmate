# Deploys a temporary preview of ClassMate for every pull request, so
# changes can be reviewed on a real, live URL before merging - the
# preview channel expires automatically after a few days and never
# touches the live site at classmate-302c2.web.app.
#
# `permissions` below is REQUIRED, not optional: with no explicit block,
# GITHUB_TOKEN falls back to this repo's default workflow permissions,
# which are evidently read-only here — action-hosting-deploy@v0 needs to
# POST a check run (to report the preview URL/status) and comment on the
# PR (to post the preview link), both of which a read-only token cannot
# do, producing exactly a 403 "Resource not accessible by integration"
# on POST /check-runs. Scoped to the three permissions this one action
# actually uses (confirmed against learning-hub's own identical,
# already-working workflow for the same action) — not broadened beyond
# that, and scoped to this workflow file only, not applied repo-wide.
permissions:
  checks: write
  contents: read
  pull-requests: write

name: Deploy preview on PR
on: pull_request
jobs:
  deploy_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLASSMATE_302C2 }}'
          projectId: classmate-302c2
