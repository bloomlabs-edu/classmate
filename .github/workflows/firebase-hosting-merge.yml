# Deploys ClassMate to Firebase Hosting on every push to main.
#
# No build step - this is a static HTML/CSS/JS app with no bundler,
# so the checked-out repo is deployed as-is. firebaseConfig.js is
# committed to the repository (it's not a secret - see
# js/config/firebaseConfig.example.js for why), so no config
# generation step is needed here either.
#
# The FIREBASE_SERVICE_ACCOUNT secret this workflow depends on is
# created automatically by running `firebase init hosting:github`
# from the project root - see README.md's deployment section.
#
# THE ACTUAL FIX (see this project's own production incident: a
# scoreboardArchives Firestore rule was added locally, but every
# merge to main only ever deployed Hosting — action-hosting-deploy@v0
# is Hosting-only by design, and firebase.json was MISSING a
# "firestore" key at the time — that gap has since been closed;
# firebase.json now has firestore.rules configured, confirmed present
# in this repo). The "Deploy Firestore rules" step below runs the
# Firebase CLI directly using the same service account already
# authorized for this project, so rules and hosting code can never
# drift out of sync again on a normal merge.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLASSMATE_302C2 }}'
          channelId: live
          projectId: classmate-302c2
      - name: Deploy Firestore rules
        # THE ACTUAL FIX for a prior deployment failure at this exact
        # step: the previous version of this step used a third-party
        # community action (w9jds/firebase-action@master — floating on
        # an unpinned branch, with an auth interface that couldn't be
        # verified offline) and consistently failed here even though
        # firestore.rules itself passed a full manual syntax audit
        # (balanced braces/parens, and the new scoreboardArchives rule
        # uses the exact same get()-based pattern already proven by
        # the existing, already-deployed feedPosts/studentGoals rules
        # in this same file). This step now uses the direct,
        # officially-documented Google Cloud SDK approach instead:
        # install firebase-tools, then authenticate via
        # GOOGLE_APPLICATION_CREDENTIALS — the universal, standard env
        # var Google's own tooling looks for, not a third-party
        # action's own separate interface. Same secret, same service
        # account, already proven to work for Hosting above.
        run: |
          npm install -g firebase-tools
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLASSMATE_302C2 }}' > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only firestore:rules --project classmate-302c2
